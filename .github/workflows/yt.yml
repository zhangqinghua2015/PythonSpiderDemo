name: Extract YouTube Password

on:
  schedule:
    # Run daily at 01:00 UTC (adjust as needed)
    - cron: '0 3 * * *'
  workflow_dispatch:      # Allows manual trigger

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            ffmpeg \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-chi-sim \
            python3-pip

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install yt-dlp pytesseract Pillow requests

      - name: Restore cookies (optional)
        # If you have a GitHub secret containing cookies.txt content
        env:
          COOKIES_SECRET: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$COOKIES_SECRET" ]; then
            echo "$COOKIES_SECRET" > cookies.txt
          fi

      - name: Run password extraction
        id: extract
        run: |
          python yt.py > output.txt
          # Parse the "password=..." line
          PASSWORD=$(grep -oP '^password=\K.*' output.txt)
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT
          echo "$PASSWORD" > extracted_password.txt

      - name: Upload extracted password as artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: extracted_password
          path: extracted_password.txt

      - name: Display password (for debugging, remove in production)
        run: |
          echo "Extracted password: ${{ steps.extract.outputs.password }}"
